# QuoteSys 生产反向代理配置：Nginx -> FastAPI 后端 (backend:8000)

upstream quote_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 客户端上传限制（产品照片、附件等）
    client_max_body_size 20m;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://quote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 上传文件静态资源代理
    location /uploads/ {
        proxy_pass http://quote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 工作台前端静态资源路由（支持 SPA history/hash 模式与 fallback）
    location / {
        root /usr/share/nginx/html;
        index index.html workbench.html;
        try_files $uri $uri/ /workbench.html /index.html @backend_fallback;
    }

    # 前端静态资源未独立挂载至 Nginx 时，平滑回退至 FastAPI 后端托管服务
    location @backend_fallback {
        proxy_pass http://quote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
