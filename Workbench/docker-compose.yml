# QuoteSys 后端独立服务编排（推荐在仓库根目录使用 docker-compose.yml 启动完整集群）
services:
  backend:
    build: .
    container_name: quotesys-backend
    ports:
      - "8000:8000"
    environment:
      # 默认容器内 SQLite（持久化到 backend_data 卷）
      DATABASE_URL: sqlite:///./data/app.db
      UPLOAD_DIR: /app/data/uploads
      AUTH_SECRET: quotesys-secret-key-production-change-me
      APP_NAME: quote-service
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
