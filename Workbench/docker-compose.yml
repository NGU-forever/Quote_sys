# 后端服务编排（数据库沿用现有实例，不新建生产库）
# 本地开发可选：把 DATABASE_URL 指到宿主上的现有 SQLite 库并挂载，
# 或取消下方注释启用一个临时 PostgreSQL 容器做本地联调。
services:
  backend:
    build: .
    container_name: hhz-backend
    ports:
      - "8000:8000"
    environment:
      # 默认：容器内本地 SQLite（持久化到 backend_data 卷，首次启动自动建表）
      # 连接现有库 / PostgreSQL 时改成对应连接串，例如：
      #   DATABASE_URL: postgresql+psycopg://hhz:hhz@db:5432/hhz
      #   或宿主机 SQLite：挂载宿主库并设 DATABASE_URL: sqlite:////data/app.db
      DATABASE_URL: sqlite:///./data/app.db
      UPLOAD_DIR: /app/data/uploads
      AUTH_SECRET: change-me-in-production
      DEFAULT_LATEST_VERSION: "1.3.0"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # ---- 可选：本地开发用的 PostgreSQL（默认注释，避免与现有库冲突）----
  # 启用步骤：
  #   1. 取消下方 db 服务与 volumes.db_data 的注释；
  #   2. 把 backend.environment.DATABASE_URL 改为
  #      postgresql+psycopg://hhz:hhz@db:5432/hhz
  # db:
  #   image: postgres:16-alpine
  #   container_name: hhz-db
  #   environment:
  #     POSTGRES_USER: hhz
  #     POSTGRES_PASSWORD: hhz
  #     POSTGRES_DB: hhz
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data

volumes:
  backend_data:
  # db_data:
